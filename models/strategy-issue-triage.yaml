# Rung 2: several possible responses, a rule for choosing, and a boundary.
#
# Rung 1 (models/strategy-route-back.yaml) had one response and no way to stop.
# This adds the two things that were missing, and nothing else -- there is still
# no search, no scoring, and no composition of operators.
#
# Choosing is rule-based, not scored. Each candidate declares a `when`, and the
# first whose condition holds is taken. That is genuinely a choice among known
# options; ranking candidates by an estimate of proximity to a goal is a
# different rung and is not here.
#
# The boundary is what makes this stoppable. `max_attempts` bounds how many
# times the strategy will answer without the issue converging. Crossing it does
# not fail silently -- it escalates, and the escalation carries an `authority`.
#
# That is the shape doc section 8 #2 and docs/fields.md predicted from opposite
# directions: escalation is not a peer of detect, it is a species of respond
# distinguished by naming who can make the decision count. v1's triage rule said
# urgent exceptions escalate; urgency is `due`; and `due <-> authority`.

model: strategy-issue-triage
version: 0.1

boundary:
  # Execution pressure: how many answers before this strategy admits it is not
  # getting anywhere. Two is deliberately small so the limit is easy to observe.
  max_attempts: 2

expressions:

  # Candidates are tried in order; the first whose `when` holds is the response.
  # The last must be unconditional, or a deviation could arrive that nothing
  # answers -- which is an error, not a silent no-op.
  candidates:
    list:

      # A missing root cause is not something the supplier can simply fill in.
      # It needs evidence from whoever ran the system.
      - record:
          when:
            eq:
              - ref: verdict.finding
              - missing_root_cause
          action: ask_for_logs
          to: engineering
          because:
            ref: verdict.finding
          authority: null

      # A missing owner is an assignment, which belongs to the support lead.
      - record:
          when:
            eq:
              - ref: verdict.finding
              - missing_owner
          action: assign_owner
          to: support_lead
          because:
            ref: verdict.finding
          authority: null

      # Anything else goes back to whoever supplied it.
      - record:
          when: true
          action: route_back
          to:
            ref: result.source
          because:
            ref: verdict.finding
          authority: null

  # Crossing the boundary. This is the only response that names an authority,
  # and naming one is what makes it an escalation rather than another retry.
  exhausted:
    record:
      action: escalate
      to: product
      because:
        ref: verdict.finding
      authority: product_owner

  writes:
    list:

      # Every response is recorded as an addressed write.
      - record:
          when:
            not:
              ref: next.converged
          pressure: exception
          operation: respond
          slot: response.action

      # An escalation additionally records who it was handed to. This is the
      # governance half of the write log: `authority` answers "who can make
      # this count", which no execution field does.
      - record:
          when:
            not:
              eq:
                - ref: response.authority
                - null
          pressure: exception
          operation: respond
          slot: response.authority
